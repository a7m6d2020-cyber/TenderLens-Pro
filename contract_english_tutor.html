<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📜 مُدرّس الإنجليزية التعاقدية</title>
<style>
  :root{ --navy:#003087; --blue:#1452b8; --gold:#FFB81C; --bg:#f0f4f8; --card:#fff; --line:#e3e9f0; --red:#c0392b; --green:#1a8a3a; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Tajawal",system-ui,sans-serif;background:var(--bg);color:#15233a;}
  .en{direction:ltr;text-align:left;}
  header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:20px;margin:0;}
  header .stats{margin-inline-start:auto;display:flex;gap:18px;}
  header .stat b{font-size:20px;display:block;line-height:1;}
  header .stat span{font-size:11px;opacity:.85;}
  nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 10px;position:sticky;top:0;z-index:5;}
  nav button{white-space:nowrap;border:none;background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer;font-size:14px;color:#3a4a63;}
  nav button.active{background:var(--navy);color:#fff;}
  main{max-width:1000px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;box-shadow:0 2px 10px rgba(0,48,135,.05);}
  .hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:22px;}
  .hero h2{margin:.2em 0;color:#fff;}
  .hero p{color:#dce6ff;margin:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat-num{font-size:30px;font-weight:800;color:var(--navy);line-height:1;}
  .stat-lbl{font-size:12px;color:#5b6b80;}
  h2,h3{color:var(--navy);}
  .termEN{font-size:28px;font-weight:800;color:var(--navy);}
  .ipa{color:var(--blue);font-family:"Times New Roman",serif;font-size:18px;}
  .syl{color:var(--red);font-weight:700;letter-spacing:1px;}
  .chip{display:inline-block;background:#eef3fb;color:var(--navy);border:1px solid #d4e0f2;border-radius:999px;padding:2px 11px;margin:2px;font-size:13px;}
  .pill{background:var(--gold);color:#3a2a00;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;display:inline-block;}
  button.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;margin:3px;}
  button.btn:hover{background:var(--blue);}
  button.alt{background:#eef3fb;color:var(--navy);border:1px solid #cfe0f5;}
  button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
  select,input[type=text]{border:1px solid #ccd6e6;border-radius:9px;padding:8px;font-size:14px;font-family:inherit;}
  .readEN{direction:ltr;text-align:left;font-size:18px;line-height:2;background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:right;}
  th{background:#eef3fb;color:var(--navy);}
  blockquote{border-right:4px solid var(--gold);background:#fffaf0;padding:8px 14px;border-radius:8px;margin:10px 0;}
  code{background:#eef3fb;border-radius:5px;padding:1px 5px;direction:ltr;display:inline-block;}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
  .muted{color:#5b6b80;font-size:13px;}
  .opt{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:5px 0;cursor:pointer;font-size:14px;font-family:inherit;}
  .opt:hover{border-color:var(--blue);}
  .opt.correct{background:#e7f7ec;border-color:var(--green);}
  .opt.wrong{background:#fdecea;border-color:var(--red);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .progress{height:10px;background:#e3e9f0;border-radius:999px;overflow:hidden;}
  .progress>div{height:100%;background:var(--gold);}
  .note{background:#e7f7ec;border:1px solid #bfe6cb;border-radius:10px;padding:10px 12px;}
  .info{background:#eef3fb;border:1px solid #d4e0f2;border-radius:10px;padding:10px 12px;}
  .warn{background:#fff7e6;border:1px solid #ffe0a3;border-radius:10px;padding:10px 12px;}
  details{margin:8px 0;}
  summary{cursor:pointer;font-weight:600;color:var(--navy);}
  .speakbar{display:inline-flex;gap:6px;flex-wrap:wrap;direction:ltr;vertical-align:middle;}
  .speakbar button{font-size:13px;padding:6px 10px;}
</style>
</head>

</header>

 حقاً أو صلاحية تقديرية دون إلزام: «The Engineer may...» = يجوز للمهندس، له أن يفعل أو لا يفعل.", "ex_en": "The Employer may carry out the work himself if the Contractor fails to remedy the defect.", "ex_ar": "يجوز لصاحب العمل تنفيذ العمل بنفسه إذا لم يصلح المقاولُ العيب.", "collocations": ["may at any time", "may, at its sole discretion", "may but shall not be obliged to"], "cat": "اللغة القانونية"}, {"en": "hereinafter", "ipa": "/ˌhɪərɪnˈɑːftər/", "syllables": "heer-in-AHF-tur", "ar": "المشار إليه فيما بعد بـ", "def_ar": "تُستخدم عند أول ذكر لتعريف تسمية مختصرة: (hereinafter referred to as “the Contractor”) = ويشار إليه فيما بعد بـ«المقاول».", "ex_en": "ABC Construction Co. (hereinafter referred to as “the Contractor”) agrees to execute the Works.", "ex_ar": "توافق شركة ABC للإنشاءات (ويُشار إليها فيما بعد بـ«المقاول») على تنفيذ الأعمال.", "collocations": ["hereinafter referred to as", "hereinafter called"], "cat": "اللغة القانونية", "tip": "عائلة here- تشير إلى هذا المستند: herein (في هذا العقد)، hereby (بموجب هذا)، hereto (إلى هذا)."}, {"en": "thereof / therein / thereto", "ipa": "/ðeərˈɒv/", "syllables": "thair-OV", "ar": "منه / فيه / إليه (عائدة على المذكور)", "def_ar": "عائلة there- تعود على آخر شيء ذُكر: thereof = منه/الخاص به، therein = فيه، thereto = إليه، thereunder = بموجبه.", "ex_en": "The Contract and any amendment thereof shall be binding upon the Parties.", "ex_ar": "يكون العقد وأي تعديل له ملزِماً للطرفين.", "collocations": ["or any part thereof", "the terms thereof", "attached thereto"], "cat": "اللغة القانونية", "tip": "‏th هنا مجهورة /ð/ كالذال: «ذير أوف»."}, {"en": "notwithstanding", "ipa": "/ˌnɒtwɪθˈstændɪŋ/", "syllables": "not-with-STAN-ding", "ar": "على الرغم من / بصرف النظر عن", "def_ar": "أداة ترجيح قوية: البند الذي يبدأ بها يَغلِب على ما يخالفه. «Notwithstanding Clause 5» = على الرغم مما ورد في البند 5.", "ex_en": "Notwithstanding any other provision of the Contract, the total liability shall not exceed the Contract Price.", "ex_ar": "على _ar": "تفتتح فقرات التمهيد (Recitals) في صدر العقد التي تسرد خلفيته وأغراضه، وليست التزامات بحد ذاتها.", "ex_en": "WHEREAS the Employer desires that the Works should be executed by the Contractor...", "ex_ar": "حيث إنّ صاحب العمل يرغب في أن ينفّذ المقاولُ الأعمالَ...", "collocations": ["recitals", "NOW THEREFORE it is agreed as follows"], "cat": "اللغة القانونية"}, {"en": "in accordance with", "ipa": "/ɪn əˈkɔːdəns wɪð/", "syllables": "in uh-KOR-duns with", "ar": "وفقاً لـ / طبقاً لـ", "def_ar": "أكثر عبارة تكراراً في العقود: تعني الالتزام بمطابقة النص المُحال إليه تماماً.", "ex_en": "The Works shall be executed in accordance with the Contract and to the satisfaction of the Engineer.", "ex_ar": "تُنفَّذ الأعمال وفقاً للعقد وبما يرضي المهندس.", "collocations": ["in accordance with the Contract", "in compliance with", "as per"], "cat": "اللغة القانونية", "tip": "النبر في accordance على KOR: uh-KOR-duns."}, {"en": "entitled to", "ipa": "/ɪnˈtaɪtəld tuː/", "syllables": "in-TY-tuld too", "ar": "يستحق / يحق له", "def_ar": "صيغة تقرير الحقوق: «shall be entitled to» = يكون مستحقاً لـ. أساس صياغة المطالبات: entitlement = الاستحقاق.", "ex_en": "The Contractor shall be entitled, subject to Sub-Clause 20.2, to an extension of time and payment of such Cost.", "ex_ar": "يستحق المقاول، مع مراعاة البند الفرعي 20.2، تمديداً للمدة ودفعَ تلك التكلفة.", "collocations": ["entitlement", "shall be entitled to", "entitled to payment"], "cat": "اللغة القانونية", "tip": "‏t الوسطى تُنطق خفيفة مثل d في النطق الأمريكي: in-TY-duld."}, {"en": "provided that", "ipa": "/prəˈvaɪdɪd ðæt/", "syllables": "pruh-VY-did that", "ar": "شريطة أن / بشرط", "def_ar": "تُدخل شرطاً أو قيداً أو استثناءً على الحكم السابق (proviso). من أهم أدوات تقييد الالتزامات.", "ex_en": "The Contractor may use the access route, provided that the Contractor maintains it at his own cost.", "ex_ar": "يجوز للمقاول استخدام طريق الوصول، شريطة أن يصونه على نفقته الخاصة.", "collocations": ["provided always that", "proviso", "on condition that"], "cat": "اللغة القانونية"}, {"en": "due", "ipa": "/djuː/", "syllables": "DYOO", "ar": "مستحَق / واجب الأداء", "def_ar": "ما حلّ موعد أدائه: amount due = المبلغ المستحق، due date = تاريخ الاستحقاق. أيضاً: due care = العناية الواجبة.", "ex_en": "The Employer shall pay the amount due within the period stated in the Contract.", "ex_ar": "يسدد صاحبُ العمل المبلغَ المستحق خلال المدة المحددة في العقد.", "collocations": ["amount due", "due date", "due diligence", "fall due"], "cat": "اللغة القانونية"}, {"en": "Consideration", "ipa": "/kənˌsɪdəˈreɪʃən/", "syllables": "kun-sid-uh-RAY-shun", "ar": "المُقابِل / العِوض", "def_ar": "ليست «الاهتمام»! بل العِوض المتبادَل الذي يجعل العقد مُلزِماً في القانون الإنجليزي (مال أو عمل أو وعد). لا عقد دون consideration.", "ex_en": "In consideration of the payments to be made by the Employer, the Contractor undertakes to execute the Works.", "ex_ar": "مقابلَ المدفوعات التي سيؤديها صاحبُ العمل، يتعهد المقاول بتنفيذ الأعمال.", "collocations": ["in consideration of", "good and valuable consideration", "for nominal consideration"], "cat": "كلمات بمعانٍ خاصة", "tip": "فخّ كلاسيكي: consideration هنا = العِوض، لا «المراعاة» ولا «الاهتمام»."}, {"en": "Execute", "ipa": "/ˈeksɪkjuːt/", "syllables": "EK-si-kyoot", "ar": "يُبرِم (يوقّع) / ينفّذ", "def_ar": "لها معنيان: (1) execute the Contract = يُبرِم/يوقّع العقد؛ (2) execute the Works = ينفّذ الأعمال. والسياق يحسم. (وليست «يُعدِم»!).", "ex_en": "This Agreement is executed by the duly authorised representatives of the Parties.", "ex_ar": "تُبرَم هذه الاتفاقية بواسطة ممثلي الطرفين المفوَّضين حسب الأصول.", "collocations": ["duly executed", "execute and deliver", "execution of the Works"], "cat": "كلمات بمعانٍ خاصة", "tip": "executed a deed = أبرم/وقّع محرراً. لا تخلطها بالإعدام رغم تطابق الكلمة!"}, {"en": "Discharge", "ipa": "/dɪsˈtʃɑːdʒ/", "syllables": "dis-CHARJ", "ar": "إبراء / وفاء (بالالتزام)", "def_ar": "انقضاء الالتزام بأدائه أو إبراء الذمة منه. discharge of obligations = الوفاء بالالتزامات؛ والاسم في الفيديك = إقرار المقاول بأنه استوفى كامل مستحقاته.", "ex_en": "Upon payment of the amount due, the Employer shall be discharged from all further liability under the Contract.", "ex_ar": "بسداد المبلغ المستحق، تبرأ ذمة صاحب العمل من أي مسؤولية أخرى بموجب العقد.", "collocations": ["discharge of obligations", "full and final discharge", "discharge a debt"], "cat": "كلمات بمعانٍ خاصة"}, {"en": "Instrument", "ipa": "/ˈɪnstrəmənt/", "syllables": "IN-stru-munt", "ar": "سَنَد / مُحرَّر (قانوني)", "def_ar": "وثيقة قانونية رسمية مكتوبة (كفالة، ضمان، سند). ليست «آلة موسيقية»! a negotiable instrument = سند قابل للتداول.", "ex_en": "The Performance Security shall be in the form of the instrument annexed to the Particular Conditions.", "ex_ar": "يكون ضمان حسن التنفيذ بصيغة السند المرفق بالشروط الخاصة.", "collocations": ["legal instrument", "negotiable instrument", "instrument of guarantee"], "cat": "كلمات بمعانٍ خاصة"}, {"en": "Save / Save as", "ipa": "/seɪv/", "syllables": "SAYV", "ar": "إلّا / باستثناء", "def_ar": "في اللغة القانونية save تعني except (إلّا). save as otherwise provided = إلّا فيما نُص على خلافه. (ليست «يحفظ» ولا «يُنقذ»).", "ex_en": "Save as otherwise expressly stated, all notices shall be given in writing.", "ex_ar": "فيما عدا ما نُص عليه صراحةً خلافَ ذلك، تُوجَّه جميع الإشعارات كتابةً.", "collocations": ["save as provided", "save to the extent that", "save and except"], "cat": "كلمات بمعانٍ خاصة", "tip": "إذا رأيت Save في صدر بند، اقرأها «باستثناء» وسيستقيم المعنى فوراً."}, {"en": "Construction (interpretation)", "ipa": "/kənˈstrʌkʃən/", "syllables": "kun-STRUK-shun", "ar": "تفسير (النص)", "def_ar": "بجانب «الإنشاء»، لها معنى قانوني = تفسير النصوص. rules of construction = قواعد التفسير، وليست قواعد البناء!", "ex_en": "In the construction of this Contract, the headings shall not affect its interpretation.", "ex_ar": "في تفسير هذا العقد، لا تؤثر العناوين في معناه.", "collocations": ["rules of construction", "construction of the Contract", "construed as"], "cat": "كلمات بمعانٍ خاصة", "tip": "construe (فعل) = يفسّر. construed in accordance with English law = يُفسَّر وفق القانون الإنجليزي."}, {"en": "Material", "ipa": "/məˈtɪəriəl/", "syllables": "muh-TEER-ee-ul", "ar": "جوهري / ذو أثر معتبَر", "def_ar": "صفةٌ قانونية = مؤثِّر وجوهري، لا مجرد «مادة». material breach = إخلال جوهري يبرّر الإنهاء؛ material change = تغيير جوهري.", "ex_en": "A material breach which is not remedied within the cure period shall entitle the innocent Party to terminate.", "ex_ar": "الإخلال الجوهري الذي لا يُصلَح خلال مهلة العلاج يخوّل الطرفَ المتضرر حقَّ الإنهاء.", "collocations": ["material breach", "material adverse effect", "in all material respects"], "cat": "كلمات بمعانٍ خاصة"}, {"en": "Forthwith", "ipa": "/ˌfɔːθˈwɪθ/", "syllables": "forth-WITH", "ar": "فوراً / دون إبطاء", "def_ar": "أقوى من «promptly»: تعني حالاً دون أي تأخير. كثيرة الورود في موجبات الإشعار والإصلاح العاجل.", "ex_en": "The Contractor shall forthwith give notice to the Engineer of any such error found in the documents.", "ex_ar": "يُخطر المقاولُ المهندسَ فوراً بأي خطأ من هذا القبيل يُكتشف في المستندات.", "collocations": ["forthwith upon", "shall forthwith", "remedy forthwith"], "cat": "كلمات بمعانٍ خاصة", "tip": "‏th مرتان: forth-WITH — الأولى مهموسة /θ/ والثانية مجهورة /ð/. تدرّب عليها."}, {"en": "Entire Agreement", "ipa": "/ɪnˈtaɪər əˈɡriːmənt/", "syllables": "in-TY-ur uh-GREE-munt", "ar": "بند الاتفاق الكامل", "def_ar": "بند يقرّر أن العقد المكتوب يمثّل كامل الاتفاق ويُلغي أي وعود أو مفاوضات سابقة. يحمي من الاحتجاج بتفاهمات شفهية.", "ex_en": "This Contract constitutes the entire agreement between the Parties and supersedes all prior negotiations and representations.", "ex_ar": "يمثّل هذا العقد كاملَ الاتفاق بين الطرفين ويَجُبّ كل ما سبقه من مفاوضات وإفادات.", "collocations": ["supersedes all prior agreements", "no reliance", "merger clause"], "cat": "البنود النمطية"}, {"en": "Severability", "ipa": "/sɪˌverəˈbɪlɪti/", "syllables": "si-ver-uh-BIL-i-tee", "ar": "قابلية الفصل / استقلال البنود", "def_ar": "بند يقضي بأن بطلان أحد البنود لا يُبطل بقية العقد، بل يُفصل الباطل ويبقى الباقي نافذاً.", "ex_en": "If any provision is held to be invalid or unenforceable, the remaining provisions shall continue in full force and effect.", "ex_ar": "إذا قُضي ببطلان أي حكم أو عدم قابليته للتنفيذ، تظل بقية الأحكام نافذةً بكامل قوتها.", "collocations": ["invalid or unenforceable", "remaining provisions", "shall be severed"], "cat": "البنود النمطية"}, {"en": "Waiver", "ipa": "/ˈweɪvər/", "syllables": "WAY-vur", "ar": "تنازل / إسقاط (حق)", "def_ar": "التخلي الطوعي عن حق. وبند «no waiver» يمنع اعتبار التساهل مرةً تنازلاً دائماً عن الحق.", "ex_en": "No waiver of any breach shall be deemed a waiver of any subsequent breach.", "ex_ar": "لا يُعتبر التنازل عن أي إخلال تنازلاً عن أي إخلال لاحق.", "collocations": ["waive a right", "no waiver", "waiver in writing"], "cat": "البنود النمطية", "tip": "waive (يتنازل) ≠ wave (يلوّح). كلاهما /weɪv/ لكن المعنى القانوني هو الأول."}, {"en": "Novation", "ipa": "/nəʊˈveɪʃən/", "syllables": "noh-VAY-shun", "ar": "الإحلال / تجديد الالتزام", "def_ar": "استبدال طرفٍ بطرفٍ جديد في العقد باتفاق الجميع، بحيث يحلّ الجديد محل القديم في الحقوق والالتزامات. تختلف عن الـassignment التي تنقل الحقوق فقط.", "ex_en": "The rights and obligations of the original Contractor were transferred to the new entity by way of novation.", "ex_ar": "نُقلت حقوق المقاول الأصلي والتزاماته إلى الكيان الجديد عن طريق الإحلال.", "collocations": ["deed of novation", "novate the contract", "assignment vs novation"], "cat": "البنود النمطية", "tip": "فرّق: Assignment = نقل الحقوق فقط | Novation = نقل الحقوق والالتزامات بطرفٍ جديد."}, {"en": "Time is of the essence", "ipa": "/taɪm ɪz əv ði ˈesəns/", "syllables": "TIME iz ov thee ES-uns", "ar": "الوقت عنصر جوهري", "def_ar": "عبارة تجعل المواعيد شرطاً جوهرياً، فيُجيز الإخلال بها الإنهاءَ لا مجرد التعويض. غيابها يجعل التأخير اليسير غير مُبرِّر للإنهاء غالباً.", "ex_en": "Time shall be of the essence in respect of the Contractor's obligations to achieve the Milestone Dates.", "ex_ar": "يكون الوقت عنصراً جوهرياً فيما يتعلق بالتزامات المقاول ببلوغ تواريخ المراحل.", "collocations": ["time at large", "milestone dates", "of the essence"], "cat": "البنود النمطية"}, {"en": "Best / Reasonable endeavours", "ipa": "/ˈriːzənəbl ɪnˈdevəz/", "syllables": "REE-zun-uh-bul in-DEV-urz", "ar": "بذل أقصى / معقول الجهود", "def_ar": "معياران للالتزام بالسعي: best endeavours التزام مشدَّد (قد يكلّف الطرف ولو على حسابه)، وreasonable endeavours أخف (الجهد المعقول تجارياً). الفرق بينهما محل نزاعات كثيرة.", "ex_en": "The Contractor shall use reasonable endeavours to mitigate the effects of any delay.", "ex_ar": "يبذل المقاول جهوداً معقولة للتخفيف من آثار أي تأخير.", "collocations": ["best endeavours", "all reasonable endeavours", "commercially reasonable efforts"], "cat": "البنود النمطية", "tip": "endeavour بريطانية (الأمريكية endeavor). النبر in-DEV-ur، والـ-our تُنطق /ə/ خفيفة."}, {"en": "Estoppel", "ipa": "/ɪˈstɒpəl/", "syllables": "i-STOP-ul", "ar": "الإغلاق / المنع الحُكمي", "def_ar": "مبدأ يمنع الطرف من التمسّك بموقفٍ يناقض تصرفاً سابقاً منه اعتمد عليه الطرف الآخر. أي: لا يجوز لك أن «تنقض ما بنى عليه غيرُك».", "ex_en": "The Employer is estopped from denying the validity of the variation it previously approved in writing.", "ex_ar": "يُمنع صاحبُ العمل من إنكار صحة التغيير الذي سبق أن أقرّه كتابةً.", "collocations": ["promissory estoppel", "estopped from", "waiver and estoppel"], "cat": "البنود النمطية", "tip": "حرف t مضعّف صوتياً والنبر على STOP: i-STOP-ul."}, {"en": "Lien", "ipa": "/liːn/", "syllables": "LEEN", "ar": "حق الحبس / الامتياز", "def_ar": "حق في حبس مال الغير (أو مطالبة بأولوية) ضماناً لدين. تشترط العقود غالباً تسليم الأعمال خاليةً من أي lien.", "ex_en": "The Contractor shall ensure that the Works are free from any lien, charge or encumbrance.", "ex_ar": "يضمن المقاول أن تكون الأعمال خاليةً من أي حق حبس أو رهن أو عبء.", "collocations": ["free from liens", "charge or encumbrance", "mechanic's lien"], "cat": "البنود النمطية", "tip": "تُنطق «لِين» بياء طويلة /liːn/ — حرف i لا يُنطق كـ«اي»."}, {"en": "Condition vs Warranty", "ipa": "/kənˈdɪʃən, ˈwɒrənti/", "syllables": "kun-DI-shun / WOR-un-tee", "ar": "شرط جوهري مقابل تعهّد ثانوي", "def_ar": "في القانون الإنجليزي: condition بندٌ جوهري إخلالُه يجيز الإنهاء والتعويض؛ warranty تعهّدٌ ثانوي إخلالُه يجيز التعويض فقط لا الإنهاء. تصنيف البند يحدد العلاج.", "ex_en": "Breach of a condition entitles the innocent Party to terminate, whereas breach of a warranty sounds only in damages.", "ex_ar": "إخلال الشرط الجوهري يخوّل الطرف المتضرر الإنهاءَ، بينما إخلال التعهّد الثانوي لا يرتّب سوى التعويض.", "collocations": ["condition precedent", "breach of warranty", "innominate term"], "cat": "البنود النمطية", "tip": "‏warranty (تعهّد تعاقدي) تختلف عن guarantee (كفالة/ضمان من طرف ثالث)."}], "lessons": [{"id": "L01", "title": "مدخل: لماذا لغة العقود مختلفة؟", "level": "تأسيسي", "objectives": ["فهم خصائص الإنجليزية القانونية", "التعرف على بنية الجملة التعاقدية", "كسر حاجز الرهبة من النصوص الطويلة"], "content": "\n### لماذا تبدو لغة العقود صعبة؟\n\nالإنجليزية القانونية (Legal English) ليست لغة ثانية فحسب — حتى المتحدث الأصلي يجدها صعبة! لأنها تتميز بـ:\n\n1. **جُمل طويلة جداً** — جملة واحدة قد تمتد 100 كلمة، لأنها تحاول سدّ كل ثغرة.\n2. **مفردات لاتينية وفرنسية قديمة** — `force majeure`، `mutatis mutandis`، `bona fide`.\n3. **كلمات عادية بمعانٍ خاصة** — `Plant` لا تعني نباتاً بل **التجهيزات الآلية**! و`Consideration` لا تعني اهتماماً بل **المقابل/العِوض**.\n4. **التكرار المتعمَّد** — `terms and conditions`، `null and void`، `indemnify and hold harmless` — أزواج مترادفة للتوكيد القانوني.\n\n### المفتاح الذهبي لقراءة أي جملة تعاقدية 🔑\n\nكل جملة تعاقدية مهما طالت تتكون من:\n\n> **مَن** (الفاعل القانوني) + **shall/may** (طبيعة الالتزام) + **ماذا** (الفعل) + **متى/كيف/بأي شرط** (القيود)\n\n**مثال — جرّب تفكيكها:**\n\n> *The Contractor **shall**, within 28 days after the Commencement Date, **submit** to the Engineer a detailed programme, **unless** otherwise stated in the Particular Conditions.*\n\n| السؤال | الجواب |\n|---|---|\n| مَن؟ | The Contractor — المقاول |\n| ما طبيعة الالتزام؟ | shall — التزام واجب |\n| ماذا يفعل؟ | submit a detailed programme — يقدّم برنامجاً زمنياً |\n| متى؟ | within 28 days after the Commencement Date |\n| الاستثناء؟ | unless otherwise stated... — ما لم يُنص على غير ذلك |\n\n✅ **القاعدة**: ابحث دائماً عن الفاعل وshall/may أولاً، ثم ضع أقواساً ذهنية حول العبارات الاعتراضية.\n", "quiz": [{"q": "كلمة Plant في عقود الفيديك تعني:", "options": ["نبات", "مصنع", "التجهيزات الآلية الدائمة", "موقع العمل"], "answer": 2, "explain": "Plant في الفيديك = الأجهزة والمعدات التي تصبح جزءاً دائماً من الأعمال."}, {"q": "عند قراءة جملة تعاقدية طويلة، ما أول شيء تبحث عنه؟", "options": ["التواريخ", "الفاعل + shall/may", "أرقام البنود", "الأسماء الكبيرة"], "answer": 1, "explain": "الفاعل + الفعل الناقل للالتزام هما هيكل الجملة؛ كل الباقي قيود وتفاصيل."}]}, {"id": "L02", "title": "‏Shall / May / Must / Will — قلب لغة العقود", "level": "تأسيسي", "objectives": ["التمييز الدقيق بين أفعال الإلزام", "فهم الأثر القانوني لكل صيغة", "قراءة الالتزامات والحقوق بثقة"], "content": "\n### أربع كلمات تحكم كل عقد\n\n| الكلمة | المعنى القانوني | الترجمة | الأثر |\n|---|---|---|---|\n| **shall** | التزام واجب | يلتزم / يجب عليه | الإخلال به = إخلال بالعقد |\n| **shall not** | حظر | يُحظر عليه / لا يجوز له | فعله = إخلال بالعقد |\n| **may** | حق / صلاحية تقديرية | يجوز له | له الخيار، ولا يُلام إن لم يفعل |\n| **may not** | منع الجواز | لا يجوز له | سلب الصلاحية |\n| **must** | اشتراط/متطلب | يتعيّن | شرط لصحة شيء (غالباً في المتطلبات الفنية) |\n| **will** | إخبار مستقبلي | سوف | لا ينشئ التزاماً غالباً (يصف وقائع متوقعة) |\n\n### أمثلة حقيقية بأسلوب FIDIC\n\n1. > *The Contractor **shall** provide the Performance Security within 28 days.*\n   - **التزام**: على المقاول تقديم الضمان. إن لم يفعل → إخلال يخوّل صاحب العمل الإنهاء.\n\n2. > *The Engineer **may** instruct a Variation at any time.*\n   - **صلاحية**: للمهندس أن يأمر بتغيير — وله ألا يفعل. لا أحد يستطيع إجباره.\n\n3. > *The Employer **will** make the Site available on the Commencement Date.*\n   - **إخبار**: صياغة أضعف من shall — في النزاعات يُحتجّ بأنها وعد إخباري لا التزام صارم. (لهذا تستخدم العقود الجيدة shall دائماً للالتزامات.)\n\n### ⚠️ فخ شهير\n`shall` في الإنجليزية العامة الحديثة شبه ميتة (نقول will)، لكنها في العقود **حية وملزمة**. لا تترجمها أبداً بـ«سوف» — ترجمتها الصحيحة: **«يلتزم بـ» أو «يجب»**.\n\n### صيغ مركّبة احفظها كقوالب\n- **shall be entitled to** = يستحق / يحق له\n- **shall be deemed to** = يُعتبر حكماً\n- **shall not be liable for** = لا يكون مسؤولاً عن\n- **may, at its sole discretion** = يجوز له وفق تقديره المطلق\n", "quiz": [{"q": "«The Engineer may issue instructions» تعني أن المهندس:", "options": ["ملزم بإصدار التعليمات", "له صلاحية إصدارها دون إلزام", "ممنوع من إصدارها", "سيصدرها مستقبلاً حتماً"], "answer": 1, "explain": "may = صلاحية تقديرية: له أن يفعل وله ألا يفعل."}, {"q": "الترجمة الصحيحة لـ«The Contractor shall remedy the defect»:", "options": ["سوف يصلح المقاول العيب", "يجوز للمقاول إصلاح العيب", "يلتزم المقاول بإصلاح العيب", "ربما يصلح المقاول العيب"], "answer": 2, "explain": "shall في العقود = التزام واجب، وليست مستقبلاً بسيطاً."}, {"q": "أي صيغة تنشئ حقاً للمقاول؟", "options": ["The Contractor shall...", "The Contractor shall be entitled to...", "The Contractor will...", "The Contractor must..."], "answer": 1, "explain": "shall be entitled to = يستحق — صيغة تقرير الحقوق."}]}, {"id": "L03", "title": "عائلات Here- / There- / Where- الغامضة", "level": "تأسيسي", "objectives": ["فك شفرة hereinafter وthereof وwhereby", "قراءة الديباجات والتعريفات", "التوقف عن الارتباك أمام هذه الكلمات"], "content": "\n### القاعدة السحرية 🪄\n\nهذه الكلمات العتيقة كلها تتبع نمطاً واحداً بسيطاً:\n\n- **here-** = *this* (هذا المستند/العقد نفسه)\n- **there-** = *that / it* (الشيء المذكور قبل قليل)\n- **where-** = *which* (الذي/التي — للربط)\n\nثم أضف حرف الجر وافهم:\n\n| الكلمة | فكّكها | المعنى |\n|---|---|---|\n| **herein** | in + this | في هذا العقد |\n| **hereby** | by + this | بموجب هذا (العقد/الإشعار) |\n| **hereto** | to + this | إلى هذا العقد (attached hereto = المرفق به) |\n| **hereinafter** | in this + after | فيما بعد في هذا المستند |\n| **hereunder** | under + this | بموجب هذا العقد |\n| **thereof** | of + that | منه / الخاص بالمذكور |\n| **therein** | in + that | في المذكور |\n| **thereto** | to + that | إلى المذكور |\n| **thereunder** | under + that | بموجب المذكور |\n| **whereby** | by + which | الذي بموجبه |\n| **whereof** | of + which | الذي عنه (in witness whereof = وإشهاداً على ذلك) |\n\n### تطبيق عملي\n\n> *This Agreement and the Schedules attached **hereto** constitute the entire agreement. Any amendment **thereof** shall be in writing.*\n\n- **hereto** = to this Agreement → «الملاحق المرفقة **بهذه الاتفاقية**»\n- **thereof** = of the agreement just mentioned → «أي تعديل **لها**»\n\n> ***IN WITNESS WHEREOF**, the Parties have executed this Agreement.*\n\n- عبارة الختم التقليدية = «**وإشهاداً على ما تقدَّم**، وقّع الطرفان هذه الاتفاقية». (executed هنا = وقَّع، وليس أعدم! 😄)\n\n### 💡 خدعة القراءة السريعة\nعند مصادفة كلمة there-: ارجع للخلف وابحث عن آخر اسم رئيسي — هو المقصود. `the Contract or any part thereof` = العقد أو أي جزء **من العقد**.\n", "quiz": [{"q": "«the Works or any Section thereof» — كلمة thereof تعود على:", "options": ["العقد", "الأعمال (the Works)", "المهندس", "الموقع"], "answer": 1, "explain": "there- تعود على آخر اسم رئيسي مذكور = the Works → أي قسم من الأعمال."}, {"q": "«The Contractor hereby waives...» تعني:", "options": ["سيتنازل لاحقاً", "يتنازل بموجب هذا المستند", "تنازل في عقد سابق", "يرفض التنازل"], "answer": 1, "explain": "hereby = by this document — التنازل يقع بهذا النص نفسه فور توقيعه."}, {"q": "ما معنى IN WITNESS WHEREOF؟", "options": ["في حضور الشهود", "وإشهاداً على ما تقدّم", "بشهادة المحكمة", "للعلم والإحاطة"], "answer": 1, "explain": "عبارة ختامية تقليدية تسبق التوقيعات = إثباتاً وإشهاداً على ما سبق."}]}, {"id": "L04", "title": "المبني للمجهول والاسمية — أسلوب العقود", "level": "متوسط", "objectives": ["فهم سبب كثرة المبني للمجهول", "تحويل الأفعال الاسمية إلى أفعال بسيطة ذهنياً", "تسريع القراءة 倍"], "content": "\n### لماذا يكثر المبني للمجهول؟\n\nتقول العقود: *“The Works **shall be executed** in accordance with the Contract”* بدلاً من *“The Contractor shall execute the Works”*. لماذا؟\n\n1. **التركيز على الفعل لا الفاعل** — المهم أن تُنفَّذ الأعمال.\n2. **الحياد والعمومية** — أحياناً الفاعل غير محدد أو متعدد.\n3. ⚠️ **وأحياناً غموض مقصود** — *“payment shall be made”* — مَن يدفع؟ إن لم يُحدَّد فهذه ثغرة!\n\n**مهارتك**: عند كل مبنيٍّ للمجهول اسأل: *by whom?* — مَن الفاعل الحقيقي؟ إن لم تجد جواباً واضحاً في البند فقد وجدت نقطة ضعف تفاوضية.\n\n### الاسمية (Nominalization) — وحش العقود الثاني\n\nتحويل الفعل البسيط إلى اسم ثقيل + فعل باهت:\n\n| بدلاً من | تقول العقود | فكّكها ذهنياً إلى |\n|---|---|---|\n| terminate | **effect termination of** | أنهى |\n| pay | **make payment of** | دفع |\n| inspect | **carry out an inspection of** | فحص |\n| decide | **make a determination of** | قرر |\n| notify | **give notification to** | أخطر |\n| fail | **commit a failure / be in default** | أخفق |\n\n### تمرين التفكيك الذهني\n\n> *“Upon the occurrence of a failure by the Contractor in the performance of its obligations, the issuance of a notice shall be effected by the Employer.”*\n\nفكّكها: **If the Contractor fails to perform, the Employer shall issue a notice.**\n«إذا أخفق المقاول في أداء التزاماته، أصدر صاحبُ العمل إشعاراً.»\n\n✅ **القاعدة**: كل اسم منتهٍ بـ -tion / -ment / -ance / -ure يخفي فعلاً. اسأل: ما الفعل؟ مَن فاعله؟\n", "quiz": [{"q": "«Payment shall be made within 56 days» — ما السؤال النقدي الذي يجب أن تسأله؟", "options": ["كم المبلغ؟", "بأي عملة؟", "مَن الملزَم بالدفع؟ (by whom?)", "لماذا 56 يوماً؟"], "answer": 2, "explain": "المبني للمجهول يخفي الفاعل — إن لم يحدد البندُ الدافعَ فهذه ثغرة صياغة."}, {"q": "فكّك: «The Engineer shall make a determination of the claim»", "options": ["The Engineer shall determine the claim", "The claim determines the Engineer", "The Engineer shall delay the claim", "The claim shall be ignored"], "answer": 0, "explain": "make a determination of = determine — الاسمية تخفي الفعل البسيط."}]}, {"id": "L05", "title": "هيكل عقد الفيديك — خريطتك للكتاب الأحمر", "level": "متوسط", "objectives": ["معرفة البنود العشرين وترتيبها المنطقي", "الوصول لأي حكم خلال ثوانٍ", "فهم منطق Sub-Clause والترقيم"], "content": "\n### الكتاب الأحمر FIDIC Red Book 2017 — البنود العشرون\n\n| # | البند | المحتوى |\n|---|---|---|\n| 1 | General Provisions | التعريفات والتفسير والأولويات |\n| 2 | The Employer | التزامات صاحب العمل (الموقع، التمويل) |\n| 3 | The Engineer | صلاحيات المهندس وتعليماته وتقديراته |\n| 4 | The Contractor | الالتزامات العامة للمقاول (الأطول!) |\n| 5 | Subcontracting | مقاولو الباطن |\n| 6 | Staff and Labour | العمالة وساعات العمل |\n| 7 | Plant, Materials and Workmanship | الجودة والفحص والرفض |\n| 8 | Commencement, Delays and Suspension | المباشرة والتأخير والتعليق ⭐ |\n| 9 | Tests on Completion | اختبارات الإكمال |\n| 10 | Taking Over | التسلّم ⭐ |\n| 11 | Defects after Taking Over | العيوب بعد التسلّم |\n| 12 | Measurement and Valuation | القياس والتقييم |\n| 13 | Variations and Adjustments | التغييرات ⭐ |\n| 14 | Contract Price and Payment | الدفع ⭐ |\n| 15 | Termination by Employer | إنهاء صاحب العمل |\n| 16 | Suspension and Termination by Contractor | تعليق وإنهاء المقاول |\n| 17 | Care of the Works and Indemnities | العهدة والتعويضات |\n| 18 | Exceptional Events | الأحداث الاستثنائية (القوة القاهرة) |\n| 19 | Insurance | التأمين |\n| 20 | Claims, Disputes and Arbitration | المطالبات والمنازعات ⭐⭐ |\n\n### منطق الترقيم\n- **Clause 8** = البند الثامن كاملاً\n- **Sub-Clause 8.4** = البند الفرعي الرابع من الثامن (إشعار التأخير المحتمل... إلخ)\n- **Sub-Clause 8.4(a)** = الفقرة (أ) منه\n\n### خريطة «أين أجد؟» السريعة 🗺️\n- تأخّر المشروع؟ → **8.4/8.5** (EOT) ثم **20.2** (إجراء المطالبة)\n- أمر تغييري؟ → **13** ثم التقييم في **12**\n- ما قبضت فلوسك؟ → **14.7/14.8** (الدفع وفوائد التأخير) و**16.1** (حقك في التعليق)\n- عيوب بعد التسلّم؟ → **11**\n- حدث استثنائي؟ → **18** + إشعار **20**\n\n💡 **عادة المحترفين**: عند قراءة أي بند، اقرأ معه دائماً التعريفات (1.1) الخاصة بمصطلحاته الكبيرة — فالكلمة بحرف كبير (Capitalized) معرَّفة تعريفاً ملزماً.\n", "quiz": [{"q": "أين تجد أحكام تمديد مدة الإنجاز (EOT) في الكتاب الأحمر 2017؟", "options": ["البند 4", "البند 8", "البند 14", "البند 20"], "answer": 1, "explain": "البند 8: Commencement, Delays and Suspension — وتحديداً 8.5."}, {"q": "الكلمة المكتوبة بحرف استهلالي كبير في الفيديك (مثل Works) تعني:", "options": ["كلمة مهمة فقط", "مصطلح معرَّف تعريفاً ملزماً في 1.1", "خطأ مطبعي", "اسم علم"], "answer": 1, "explain": "الحرف الكبير = مصطلح معرَّف في بند التعريفات، بمعناه الدقيق الملزم."}, {"q": "مطالبات المقاول وإجراءاتها الزمنية تجدها في:", "options": ["البند 20", "البند 13", "البند 9", "البند 2"], "answer": 0, "explain": "Clause 20: Claims, Disputes and Arbitration — أهم بند يحفظه مدير المشروع."}]}, {"id": "L06", "title": "لغة الإشعارات والمطالبات — أخطر 28 يوماً", "level": "متقدم", "objectives": ["صياغة وفهم إشعارات المطالبة", "إدراك شروط الإسقاط الزمني", "حفظ القوالب اللغوية الجاهزة"], "content": "\n### لماذا هذا الدرس قد يساوي ملايين؟\n\nالبند 20.2.1 في فيديك 2017 يقول بصيغة مبسطة:\n\n> *The claiming Party shall give a Notice to the Engineer **no later than 28 days** after the claiming Party became aware, or should have become aware, of the event. **If the claiming Party fails to give a Notice of Claim within this period... the claiming Party shall not be entitled** to any additional payment or EOT.*\n\n**اللغة هنا «شرط إسقاط» (time-bar / condition precedent)**: فوّت 28 يوماً = خسرت حقك كاملاً، مهما كان قوياً.\n\n### مفردات الإشعار الحرجة\n\n| العبارة | المعنى | خطورتها |\n|---|---|---|\n| **became aware, or should have become aware** | علم أو كان يجب أن يعلم | العبرة بالعلم الحكمي لا الفعلي — لا ينفع «ما انتبهنا» |\n| **shall not be entitled** | يسقط استحقاقه | صياغة الإسقاط الصريح |\n| **condition precedent** | شرط واقف/مُسبق | الإشعار شرطٌ لنشوء الحق نفسه |\n| **time-barred** | مسقَط بفوات المدة | وصف المطالبة المتأخرة |\n| **contemporary records** | السجلات المعاصرة | سجلات تُعدّ وقت الحدث — عماد الإثبات |\n| **fully detailed Claim** | المطالبة المفصلة الكاملة | تُقدَّم خلال 84 يوماً (فيديك 2017) |\n\n### القالب الذهبي لإشعار مطالبة (احفظه!)\n\n> *Pursuant to Sub-Clause 20.2.1 of the Conditions of Contract, we hereby give Notice of Claim in respect of [the event], which occurred on [date] and of which we became aware on [date]. The event has caused / is likely to cause delay to the Time for Completion and/or additional Cost. Detailed particulars will follow in accordance with Sub-Clause 20.2.4. This Notice is given without prejudice to any other rights or remedies available to us under the Contract or at law.*\n\nلاحظ البنية: **السند النظامي → الإعلان → الوصف → الأثر → الحفظ العام للحقوق**.\n\n### عبارات حفظ الحقوق (Reservation of Rights)\n- *without prejudice to our other rights and remedies* — دون إخلال بحقوقنا الأخرى\n- *we reserve all our rights under the Contract and at law* — نحتفظ بكامل حقوقنا\n- *nothing herein shall be construed as a waiver* — لا يُفسَّر أي مما ورد هنا تنازلاً\n", "quiz": [{"q": "ما أثر فوات مهلة 28 يوماً لإشعار المطالبة في فيديك 2017؟", "options": ["غرامة مالية فقط", "سقوط الحق في التمديد والدفعة الإضافية", "تمديد المهلة تلقائياً", "إحالة فورية للتحكيم"], "answer": 1, "explain": "البند 20.2.1 شرطُ إسقاطٍ صريح: shall not be entitled — يسقط الحق كله."}, {"q": "«should have become aware» تعني أن العبرة بـ:", "options": ["العلم الفعلي فقط", "العلم الحكمي: ما كان يجب أن يعلمه", "إقرار الطرف الآخر", "تاريخ التوقيع"], "answer": 1, "explain": "معيار موضوعي: متى كان ينبغي لمقاول يقظ أن يعلم؟ لا ينفع التذرّع بعدم الانتباه."}, {"q": "عبارة «without prejudice to our other rights» غرضها:", "options": ["التنازل عن الحقوق", "حفظ بقية الحقوق من السقوط الضمني", "إنهاء العقد", "طلب التحكيم"], "answer": 1, "explain": "عبارة حفظ حقوق: ممارسةُ حقٍّ لا تعني التنازل عن غيره."}]}, {"id": "L07", "title": "قراءة بند فيديك كامل — تشريح حي", "level": "متقدم", "objectives": ["تطبيق كل المهارات على نص كامل", "بناء عادة التفكيك المنهجي", "الاستغناء عن الترجمة"], "content": "\n### النص (بأسلوب Sub-Clause 8.5 — EOT)\n\n> *The Contractor shall be entitled subject to Sub-Clause 20.2 [Claims for Payment and/or EOT] to Extension of Time if and to the extent that completion for the purposes of Sub-Clause 10.1 [Taking Over of the Works and Sections] is or will be delayed by any of the following causes: (a) a Variation; (b) a cause of delay giving an entitlement to EOT under a Sub-Clause of these Conditions; (c) exceptionally adverse climatic conditions; ...*\n\n### التشريح خطوة بخطوة 🔬\n\n**الخطوة 1 — الهيكل:** مَن؟ `The Contractor`. الصيغة؟ `shall be entitled to` = **حق** (لا التزام).\n\n**الخطوة 2 — القيود قبل الحق:**\n- `subject to Sub-Clause 20.2` → الحق **مشروط** بالتقيد بإجراءات المطالبة (الإشعار خلال 28 يوماً!). الحق هنا مقيد بإجراء هناك.\n\n**الخطوة 3 — مفتاح دقيق جداً:** `if and to the extent that`\n- ليس «إذا» فقط، بل «إذا وبقدر ما» — التمديد **بمقدار** التأخير الفعلي على الإكمال، لا أكثر. لو تأخر نشاطٌ غير حرج 30 يوماً ولم يتأخر الإكمال، فلا تمديد.\n\n**الخطوة 4 — المعيار:** `is or will be delayed` — التأخير الواقع **أو المتوقع**: يمكن المطالبة استباقياً قبل وقوع التأخير فعلاً.\n\n**الخطوة 5 — الأسباب (a), (b), (c):** قائمة حصرية اقرأها سبباً سبباً. لاحظ `exceptionally adverse climatic conditions` — ليست أي أحوال جوية سيئة، بل **استثنائية** الشدّة (قياساً بالبيانات المناخية المعتادة للموقع).\n\n### الترجمة الاحترافية الكاملة\n\n> «يستحق المقاول، مع مراعاة البند الفرعي 20.2، تمديداً لمدة الإنجاز إذا تأخّر الإكمالُ لأغراض البند الفرعي 10.1 أو كان سيتأخر، وبقدر ذلك التأخر، بسبب أيٍّ من الأسباب الآتية: (أ) تغيير؛ (ب) سببِ تأخيرٍ يمنح استحقاقاً للتمديد بموجب بندٍ من هذه الشروط؛ (ج) أحوالٍ مناخية معاكسة على نحو استثنائي؛ ...»\n\n### 🏆 اختبر نفسك قبل الكويز\nأعد قراءة النص الإنجليزي وحده الآن. هل تحتاج الترجمة؟ إن كان «لا» — فأنت على الطريق الصحيح.\n", "quiz": [{"q": "«if and to the extent that» تعني أن التمديد يُمنح:", "options": ["كاملاً عند أي تأخير", "بقدر تأثر الإكمال فعلاً فقط", "حسب تقدير المقاول", "مضاعفاً"], "answer": 1, "explain": "وبقدر ما — لو لم يتأثر الإكمال (تأخير غير حرج) فلا تمديد."}, {"q": "«is or will be delayed» تتيح المطالبة:", "options": ["بعد وقوع التأخير فقط", "قبل وقوع التأخير المتوقع أيضاً", "بعد التسلّم فقط", "خلال التحكيم فقط"], "answer": 1, "explain": "التأخير الواقع أو المتوقع — مطالبة استباقية مشروعة."}, {"q": "حق التمديد في 8.5 مشروط بـ:", "options": ["موافقة صاحب العمل المسبقة", "التقيد بإجراءات المطالبة في 20.2", "دفع رسوم", "تقرير خبير"], "answer": 1, "explain": "subject to Sub-Clause 20.2 — بدون الإشعار في مهلته يسقط الحق."}]}, {"id": "L08", "title": "لغة الدفع والمستخلصات", "level": "متقدم", "objectives": ["إتقان دورة الدفع الكاملة بمفرداتها", "قراءة بنود الدفع وفوائد التأخير", "فهم الاحتجاز والاسترداد"], "content": "\n### دورة الدفع في الفيديك — بالمصطلحات\n\n1. **Statement** (الكشف/المستخلص): يقدّمه المقاول شهرياً مع المستندات المؤيدة (supporting documents).\n2. **Interim Payment Certificate — IPC**: يصدرها المهندس خلال 28 يوماً محدداً **the amount which he fairly considers to be due** (المبلغ الذي يراه بإنصاف مستحقاً).\n3. **Payment**: يسدد صاحب العمل خلال 56 يوماً من تسلّم الكشف.\n4. عند التأخر: **financing charges** (أعباء تمويل) مركّبة شهرياً، **without formal notice or certification** — دون حاجة لإشعار رسمي!\n\n### مفردات الخصوم والاستردادات\n\n| المصطلح | المعنى |\n|---|---|\n| **deduction** | خصم/استقطاع |\n| **retention (money)** | المحتجزات (5-10٪) |\n| **release of retention** | ردّ المحتجزات (نصف عند التسلّم ونصف بعد فترة العيوب) |\n| **repayment of advance** | استرداد الدفعة المقدمة (خصماً نسبياً) |\n| **set-off / contra charge** | المقاصة — خصم مستحقات متقابلة |\n| **withhold** | يحجب/يمتنع عن صرف |\n\n### صياغات احفظها كقوالب\n\n> *The Employer shall pay to the Contractor the amount certified in each Interim Payment Certificate within 56 days after the Engineer receives the Statement and supporting documents.*\n\n> *If the Contractor does not receive payment in accordance with Sub-Clause 14.7, the Contractor shall be entitled to receive financing charges compounded monthly on the amount unpaid during the period of delay.*\n\n> *The Employer may withhold the amount of any contra charges properly due from the Contractor, **provided that** details are given in a Notice with supporting particulars.*\n\n### ⚠️ فخّان لغويان\n1. **certified ≠ paid**: صدور الشهادة لا يعني قبض المال — لكل منهما مهلة وأحكام.\n2. **fairly considers**: تقدير المهندس يجب أن يكون منصفاً — وهي عبارة تفتح باب الطعن إذا تعسّف.\n", "quiz": [{"q": "‏financing charges في الفيديك تستحق:", "options": ["بإشعار رسمي وشهادة", "تلقائياً دون إشعار أو شهادة", "بحكم قضائي", "بموافقة صاحب العمل"], "answer": 1, "explain": "النص صريح: without formal notice or certification — تلقائياً بمجرد التأخر."}, {"q": "‏set-off تعني:", "options": ["بدء الأعمال", "المقاصة بين مستحقات متقابلة", "إيقاف الأعمال", "تسوية ودية"], "answer": 1, "explain": "خصم ما يستحقه طرف من مستحقات الطرف الآخر المقابلة."}]}, {"id": "L09", "title": "لغة الإنهاء والمنازعات — قراءة بنود المعارك", "level": "متقدم", "objectives": ["قراءة بنود الإنهاء بدقة جراحية", "فهم سلّم تسوية المنازعات", "إتقان مفردات التحكيم"], "content": "\n### لغة الإنهاء — درجات الحرارة\n\n| الصيغة | المعنى | الحدّة |\n|---|---|---|\n| **Notice to Correct** | إشعار بتصحيح التقصير خلال مهلة | 🌡️ إنذار |\n| **notice of intention to terminate** | إشعار بنيّة الإنهاء (14 يوماً عادة) | 🌡️🌡️ تهديد رسمي |\n| **notice of termination** | إشعار الإنهاء النافذ | 🌡️🌡️🌡️ القطيعة |\n| **termination for convenience** | إنهاء للملاءمة (دون خطأ المقاول) | حق صاحب العمل بتعويض عادل |\n| **with immediate effect** | بأثر فوري (للإعسار والفساد) | ⚡ |\n\n> *...the Employer may **by giving 14 days' notice** to the Contractor, **terminate the Contract**. However, in the case of sub-paragraph (f) or (g), the Employer may by notice terminate the Contract **with immediate effect**.*\n\nلاحظ: المهلة 14 يوماً قاعدة، والفوري استثناء لحالات الإفلاس والرشوة.\n\n### سلّم المنازعات في فيديك 2017 🪜\n\n1. **Claim** → تقدير المهندس (**Agreement or Determination — 3.7**)\n2. عدم الرضا؟ → **NOD** ‏(Notice of Dissatisfaction) خلال **28 يوماً**\n3. الإحالة إلى **DAAB** → قرار خلال **84 يوماً** — مُلزم فوراً (binding) وإن لم يكن نهائياً\n4. NOD ضد قرار المجلس خلال **28 يوماً** → محاولة **تسوية ودية** (28 يوماً)\n5. **Arbitration** — تحكيم دولي (قواعد ICC غالباً) — **final and binding**\n\n### مفردات التحكيم الأساسية\n- **arbitral tribunal** = هيئة التحكيم | **arbitrator** = المحكَّم\n- **seat of arbitration** = مقرّ التحكيم (يحدد القانون الإجرائي!)\n- **award** = حكم التحكيم | **enforce an award** = تنفيذ الحكم\n- **interim/conservatory measures** = تدابير مؤقتة/تحفظية\n- **costs follow the event** = الخاسر يتحمل الأتعاب\n\n### 💡 عبارة يخطئ فيها الجميع\n**“binding” ≠ “final and binding”**: قرار الـDAAB مُلزم فوراً (يجب تنفيذه) لكنه غير نهائي (يقبل التحكيم). حكم التحكيم نهائي وملزم معاً.\n", "quiz": [{"q": "متى يجوز الإنهاء بأثر فوري (with immediate effect)؟", "options": ["أي تأخير", "الإعسار والرشوة ونحوها", "خلاف على مستخلص", "رفض تغيير"], "answer": 1, "explain": "القاعدة إشعار 14 يوماً؛ والفوري استثناء لحالات قصوى كالإفلاس والفساد."}, {"q": "قرار الـDAAB الذي لم يُعترض عليه بـNOD خلال 28 يوماً يصبح:", "options": ["لاغياً", "نهائياً وملزماً", "استشارياً", "معلَّقاً"], "answer": 1, "explain": "بفوات مهلة إشعار عدم الرضا يتحول القرار من ملزم إلى نهائي وملزم."}, {"q": "‏seat of arbitration تحدد:", "options": ["مكان الجلسات فقط", "القانون الإجرائي الحاكم للتحكيم", "لغة التحكيم", "عدد المحكمين"], "answer": 1, "explain": "المقرّ مفهوم قانوني يحدد قانون التحكيم والمحاكم المشرفة — وقد تُعقد الجلسات في غيره."}]}], "passages": [{"id": "R01", "title": "بند ضمان حسن التنفيذ (بأسلوب Sub-Clause 4.2)", "difficulty": "⭐⭐ متوسط", "text": "The Contractor shall obtain, at his cost, a Performance Security for proper performance, in the amount stated in the Contract Data and denominated in the currency of the Contract. The Contractor shall deliver the Performance Security to the Employer within 28 days after receiving the Letter of Acceptance, and shall send a copy to the Engineer. The Performance Security shall be issued by a bank or financial institution approved by the Employer, and shall be valid until the Contractor has executed and completed the Works and remedied any defects. The Employer shall not make a claim under the Performance Security, except for amounts to which the Employer is entitled under the Contract.", "translation": "يستصدر المقاول، على نفقته، ضمانَ حسن تنفيذٍ للأداء السليم بالمبلغ المحدد في بيانات العقد وبعملة العقد. ويسلّم المقاولُ ضمانَ حسن التنفيذ إلى صاحب العمل خلال 28 يوماً من تسلّمه خطابَ القبول، ويرسل نسخةً إلى المهندس. ويصدر الضمانُ من بنكٍ أو مؤسسةٍ مالية يوافق عليها صاحبُ العمل، ويظل سارياً حتى ينفّذ المقاولُ الأعمالَ ويكملها ويصلح أيَّ عيوب. ولا يطالب صاحبُ العمل بموجب ضمان حسن التنفيذ إلا بالمبالغ التي يستحقها بموجب العقد.", "glossary": {"obtain": "يستصدر / يحصل على", "at his cost": "على نفقته الخاصة", "denominated in": "مقوَّم بـ (عملة)", "deliver": "يسلّم", "Letter of Acceptance": "خطاب القبول/الترسية", "issued by": "صادر من", "approved by": "معتمَد من", "valid until": "ساري المفعول حتى", "remedied": "أصلح / عالج", "make a claim under": "يطالب بموجب (الضمان)", "entitled": "مستحِق"}, "questions": [{"q": "خلال كم يوماً يجب تسليم الضمان؟ ومن أي تاريخ؟", "options": ["14 يوماً من التوقيع", "28 يوماً من تسلّم خطاب القبول", "56 يوماً من المباشرة", "7 أيام من أول مستخلص"], "answer": 1}, {"q": "متى يجوز لصاحب العمل المطالبة بموجب الضمان؟", "options": ["متى شاء", "فقط بالمبالغ المستحقة له بموجب العقد", "بعد التحكيم فقط", "لا يجوز مطلقاً"], "answer": 1}]}, {"id": "R02", "title": "بند غرامات التأخير (بأسلوب Sub-Clause 8.8)", "difficulty": "⭐⭐ متوسط", "text": "If the Contractor fails to comply with the Time for Completion, the Contractor shall, subject to the notice requirements of Sub-Clause 20.2, pay Delay Damages to the Employer for this default. These Delay Damages shall be the amount stated in the Contract Data, which shall be paid for every day which shall elapse between the relevant Time for Completion and the relevant Date of Completion of the Works. However, the total amount due under this Sub-Clause shall not exceed the maximum amount of Delay Damages (if any) stated in the Contract Data. These Delay Damages shall be the only damages due from the Contractor for such default, other than in the event of termination prior to completion of the Works.", "translation": "إذا أخفق المقاول في التقيد بمدة الإنجاز، دفع المقاولُ — مع مراعاة متطلبات الإشعار في البند الفرعي 20.2 — تعويضاتِ تأخيرٍ إلى صاحب العمل عن هذا التقصير. وتكون تعويضات التأخير بالمبلغ المحدد في بيانات العقد، وتُدفع عن كل يومٍ ينقضي بين مدة الإنجاز المعنية وتاريخ إكمال الأعمال المعني. غير أن إجمالي المبلغ المستحق بموجب هذا البند الفرعي لا يتجاوز الحدَّ الأقصى لتعويضات التأخير (إن وُجد) المحددَ في بيانات العقد. وتكون تعويضات التأخير هذه هي التعويضات الوحيدة المستحقة على المقاول عن هذا التقصير، إلا في حالة الإنهاء قبل إكمال الأعمال.", "glossary": {"fails to comply with": "يخفق في التقيد بـ", "Delay Damages": "تعويضات/غرامات التأخير", "default": "تقصير", "elapse": "ينقضي (الوقت)", "shall not exceed": "لا يتجاوز", "maximum amount": "الحد الأقصى (السقف)", "the only damages due": "التعويضات الوحيدة المستحقة", "other than": "باستثناء / إلا", "prior to": "قبل"}, "questions": [{"q": "ما سقف غرامات التأخير؟", "options": ["لا سقف لها", "الحد الأقصى المحدد في بيانات العقد", "10٪ دائماً", "قيمة العقد كاملة"], "answer": 1}, {"q": "عبارة «the only damages due» تعني أن غرامة التأخير:", "options": ["تضاف لها تعويضات أخرى عن التأخير", "هي التعويض الحصري عن التأخير (عدا حالة الإنهاء)", "اختيارية", "رمزية"], "answer": 1}]}, {"id": "R03", "title": "بند الأحداث الاستثنائية (بأسلوب Clause 18)", "difficulty": "⭐⭐⭐ متقدم", "text": "\"Exceptional Event\" means an event or circumstance which: (i) is beyond a Party's control; (ii) the Party could not reasonably have provided against before entering into the Contract; (iii) having arisen, such Party could not reasonably have avoided or overcome; and (iv) is not substantially attributable to the other Party. If a Party is or will be prevented from performing any of its obligations under the Contract by an Exceptional Event, then it shall give a Notice to the other Party of such an Exceptional Event, and shall specify the obligations, the performance of which is or will be prevented. The Notice shall be given within 14 days after the Party became aware, or should have become aware, of the Exceptional Event. The affected Party shall be excused performance of the prevented obligations from the date such performance is prevented by the Exceptional Event.", "translation": "«الحدث الاستثنائي» يعني حدثاً أو ظرفاً: (1) خارجاً عن سيطرة الطرف؛ و(2) لم يكن بوسع الطرف، على نحوٍ معقول، الاحتياط له قبل إبرام العقد؛ و(3) لم يكن بوسعه، عند وقوعه، تجنُّبه أو التغلب عليه على نحوٍ معقول؛ و(4) لا يُعزى جوهرياً إلى الطرف الآخر. فإذا مُنع طرفٌ أو كان سيُمنع من أداء أيٍّ من التزاماته بموجب العقد بسبب حدثٍ استثنائي، وجّه إشعاراً إلى الطرف الآخر بذلك الحدث الاستثنائي محدداً الالتزاماتِ الممنوعَ أو المتوقعَ منعُ أدائها. ويوجَّه الإشعار خلال 14 يوماً من علم الطرف بالحدث الاستثنائي أو من التاريخ الذي كان يجب أن يعلم به فيه. ويُعفى الطرفُ المتأثر من أداء الالتزامات الممنوعة اعتباراً من تاريخ منع الأداء بالحدث الاستثنائي.", "glossary": {"beyond a Party's control": "خارج عن سيطرة الطرف", "provided against": "احتاط له", "having arisen": "عند وقوعه", "avoided or overcome": "تجنّبه أو التغلب عليه", "substantially attributable to": "يُعزى جوهرياً إلى", "prevented from performing": "ممنوع من الأداء", "specify": "يحدد", "should have become aware": "كان يجب أن يعلم", "excused performance": "مُعفى من الأداء"}, "questions": [{"q": "كم شرطاً يجب توافرها معاً ليُعتبر الحدث استثنائياً؟", "options": ["شرطان", "ثلاثة", "أربعة", "خمسة"], "answer": 2}, {"q": "مهلة الإشعار بالحدث الاستثنائي:", "options": ["28 يوماً", "14 يوماً من العلم أو وجوب العلم", "7 أيام من الوقوع", "بلا مهلة"], "answer": 1}, {"q": "أثر الحدث الاستثنائي على الالتزامات الممنوعة:", "options": ["إلغاؤها نهائياً", "الإعفاء من أدائها مدة المنع", "مضاعفتها", "تحويلها للطرف الآخر"], "answer": 1}]}, {"id": "R04", "title": "ديباجة اتفاقية عقد (Contract Agreement)", "difficulty": "⭐ تأسيسي", "text": "THIS AGREEMENT is made on the 15th day of January 2026 BETWEEN Al-Rawaf Development Company of Riyadh, Kingdom of Saudi Arabia (hereinafter called \"the Employer\") of the one part, AND Gulf Construction Ltd of Dammam, Kingdom of Saudi Arabia (hereinafter called \"the Contractor\") of the other part. WHEREAS the Employer desires that the Works known as the Northern Logistics Park should be executed by the Contractor, and has accepted a Tender by the Contractor for the execution and completion of these Works and the remedying of any defects therein, NOW THEREFORE the Employer and the Contractor agree as follows: In this Agreement words and expressions shall have the same meanings as are respectively assigned to them in the Conditions of Contract hereinafter referred to. IN WITNESS WHEREOF the parties hereto have caused this Agreement to be executed the day and year first before written.", "translation": "حُررت هذه الاتفاقية في اليوم الخامس عشر من يناير 2026 بين شركة الرواف للتطوير، الرياض، المملكة العربية السعودية (ويشار إليها فيما بعد بـ«صاحب العمل») طرفاً أول، وشركة الخليج للإنشاءات المحدودة، الدمام، المملكة العربية السعودية (ويشار إليها فيما بعد بـ«المقاول») طرفاً ثانياً. وحيث إنّ صاحب العمل يرغب في أن ينفّذ المقاولُ الأعمالَ المعروفة بـ«المجمع اللوجستي الشمالي»، وقد قَبِل عطاءً من المقاول لتنفيذ هذه الأعمال وإكمالها وإصلاح أي عيوب فيها، فقد اتفق صاحبُ العمل والمقاول، بناءً على ما تقدم، على ما يلي: تكون للكلمات والعبارات في هذه الاتفاقية المعاني نفسها المخصصة لها في شروط العقد المشار إليها فيما بعد. وإشهاداً على ما تقدّم، أبرم الطرفان هذه الاتفاقية في اليوم والسنة المذكورَين أول هذا المحرر.", "glossary": {"THIS AGREEMENT is made": "حُررت هذه الاتفاقية", "hereinafter called": "ويشار إليه فيما بعد بـ", "of the one part": "طرفاً أول", "WHEREAS": "حيث إنّ", "desires": "يرغب", "remedying of any defects therein": "إصلاح أي عيوب فيها", "NOW THEREFORE": "وبناءً على ما تقدّم", "respectively assigned": "المخصصة لكلٍّ منها", "IN WITNESS WHEREOF": "وإشهاداً على ما تقدّم", "parties hereto": "طرفا هذه الاتفاقية", "executed": "أبرم / وقّع"}, "questions": [{"q": "كلمة executed في ختام الديباجة تعني:", "options": ["أعدم", "نفّذ الأعمال", "وقّع وأبرم", "ألغى"], "answer": 2}, {"q": "فقرات WHEREAS في صدر العقد:", "options": ["التزامات ملزمة", "تمهيد يسرد الخلفية والغرض", "شروط الدفع", "بنود التحكيم"], "answer": 1}]}], "dialogues": [{"id": "D01", "title": "اجتماع متابعة في الموقع — تأخير ومطالبة بالتمديد", "scenario_ar": "اجتماع أسبوعي في الموقع بين المهندس الاستشاري ومدير مشروع المقاول لمناقشة تأخّرٍ أثّر على المسار الحرج ونيّة المقاول المطالبة بتمديد المدة.", "lines": [{"speaker": "Engineer", "en": "Good morning. Let's start with the programme. You're now two weeks behind on the foundation works. What's driving the delay?", "ar": "صباح الخير. لنبدأ بالبرنامج الزمني. أنتم الآن متأخرون أسبوعين في أعمال الأساسات. ما سبب التأخير؟"}, {"speaker": "Contractor's PM", "en": "The delay is due to the late issue of the revised foundation drawings. We received them eleven days after the date in the programme.", "ar": "التأخير بسبب تأخّر إصدار مخططات الأساسات المعدّلة. استلمناها بعد أحد عشر يوماً من التاريخ المحدد في البرنامج."}, {"speaker": "Engineer", "en": "Noted. But is this activity actually on the critical path? An EOT is only justified if completion is affected.", "ar": "أحطتُ علماً. لكن هل هذا النشاط فعلاً على المسار الحرج؟ التمديد لا يُبرَّر إلا إذا تأثّر الإنجاز."}, {"speaker": "Contractor's PM", "en": "Yes. The foundations are a predecessor to the structural frame, so the delay flows straight through to the completion date.", "ar": "نعم. الأساسات نشاط سابق للهيكل الإنشائي، فالتأخير ينتقل مباشرةً إلى تاريخ الإنجاز."}, {"speaker": "Engineer", "en": "Understood. Have you served a Notice of Claim yet? You're well aware the 28-day period is a condition precedent.", "ar": "مفهوم. هل قدّمتم إشعار مطالبة بعد؟ تعلمون جيداً أن مهلة الـ28 يوماً شرط واقف."}, {"speaker": "Contractor's PM", "en": "We submitted the Notice of Claim last Sunday, within time. The fully detailed claim with particulars will follow within the 84 days.", "ar": "قدّمنا إشعار المطالبة الأحد الماضي، ضمن المهلة. وستتبعه المطالبة المفصّلة الكاملة بالمستندات المؤيِّدة خلال الـ84 يوماً."}, {"speaker": "Engineer", "en": "Good. Make sure your contemporary records are watertight — daily logs, correspondence, the lot. I'll assess entitlement once I have the particulars.", "ar": "جيد. تأكّدوا من إحكام سجلاتكم المعاصرة — اليوميات والمراسلات وكل شيء. سأقدّر الاستحقاق حال وصول التفاصيل."}, {"speaker": "Contractor's PM", "en": "Agreed. We're also reserving our rights on the associated prolongation costs, without prejudice to the time claim.", "ar": "متفقون. ونحتفظ أيضاً بحقوقنا في تكاليف الإطالة المرتبطة، دون إخلال بمطالبة الوقت."}, {"speaker": "Engineer", "en": "Fair enough. Let's reconvene next week. In the meantime, please mitigate where you can and keep me posted.", "ar": "معقول. لنجتمع الأسبوع القادم. وفي غضون ذلك، خفّفوا الأثر قدر الإمكان وأبقوني على اطّلاع."}], "glossary": {"behind on": "متأخر في", "What's driving the delay?": "ما سبب/محرّك التأخير؟", "late issue of the drawings": "تأخّر إصدار المخططات", "critical path": "المسار الحرج", "predecessor": "نشاط سابق (في الجدول)", "flows through to": "ينتقل أثره إلى", "Notice of Claim": "إشعار المطالبة", "condition precedent": "شرط واقف/مُسبق", "contemporary records": "السجلات المعاصرة", "reserving our rights": "نحتفظ بحقوقنا", "prolongation costs": "تكاليف الإطالة", "without prejudice to": "دون إخلال بـ", "mitigate": "يخفّف الأثر / يحدّ من الضرر"}, "notes_ar": "لاحظ عبارة condition precedent — تُقال بنبرٍ على المقطعين con-DI-tion pre-CE-dent. وفي اجتماعات الموقع تُختصر كثير من العبارات: \"keep me posted\" = أبقني على اطلاع، \"the lot\" = كل شيء. الأسلوب مهني مباشر لكنه مهذّب: استخدم \"Noted\" و\"Fair enough\" و\"Agreed\" لإدارة النقاش."}, {"id": "D02", "title": "التفاوض على أمر تغييري وتقييمه", "scenario_ar": "نقاش بين المهندس ومدير عقود المقاول حول أمر تغييري لزيادة سُمك طبقة الأساس، وكيفية تقييمه استناداً إلى أسعار جدول الكميات.", "lines": [{"speaker": "Engineer", "en": "I'm instructing a Variation to increase the sub-base thickness from 200 to 300 millimetres across the yard.", "ar": "أُصدر أمر تغيير لزيادة سُمك طبقة الأساس من 200 إلى 300 مليمتر في كامل الساحة."}, {"speaker": "Contractor's QS", "en": "Received. Shall we value it using the existing BOQ rate for sub-base, since it's the same item, just a greater quantity?", "ar": "استلمنا. هل نقيّمه بسعر جدول الكميات الحالي لطبقة الأساس، ما دام البند نفسه بكمية أكبر؟"}, {"speaker": "Engineer", "en": "That's my view too. The work is of similar character and executed under similar conditions, so the contract rate applies.", "ar": "هذا رأيي أيضاً. العمل ذو طبيعة مماثلة ويُنفَّذ بظروف مماثلة، فينطبق سعر العقد."}, {"speaker": "Contractor's QS", "en": "Agreed in principle. However, the extra haulage pushes us beyond the rate's assumptions. We'd claim a rate adjustment for the additional cartage.", "ar": "متفقون مبدئياً. غير أن النقل الإضافي يتجاوز افتراضات السعر. سنطالب بتعديل السعر مقابل النقل الإضافي."}, {"speaker": "Engineer", "en": "Substantiate it and I'll consider a new rate for that element. For anything with no applicable rate, we'll fall back on Dayworks.", "ar": "أثبتوا ذلك وسأنظر في سعرٍ جديد لذلك العنصر. وما لا ينطبق عليه سعر، نلجأ فيه إلى أعمال المياومة."}, {"speaker": "Contractor's QS", "en": "Understood. We'll submit the build-up of the new rate with our cost records, and price the rest at BOQ rates.", "ar": "مفهوم. سنقدّم تفصيل بناء السعر الجديد مع سجلات تكاليفنا، ونُسعّر الباقي بأسعار جدول الكميات."}, {"speaker": "Engineer", "en": "Good. Proceed with the Variation now; we shouldn't hold up the works while we finalise the valuation.", "ar": "جيد. باشروا التغيير الآن؛ يجب ألا نعطّل الأعمال ريثما نُنهي التقييم."}, {"speaker": "Contractor's QS", "en": "We'll proceed and keep the commercial side open. I'll send the valuation for your determination by Thursday.", "ar": "سنباشر ونُبقي الجانب التجاري مفتوحاً. سأرسل التقييم لتقديركم بحلول الخميس."}], "glossary": {"instructing a Variation": "إصدار أمر تغييري", "sub-base": "طبقة الأساس (تحت السطحية)", "value it using the existing rate": "تقييمه بالسعر الحالي", "BOQ rate": "سعر جدول الكميات", "similar character / conditions": "طبيعة/ظروف مماثلة", "rate adjustment": "تعديل السعر", "haulage / cartage": "النقل (للمواد)", "substantiate": "يُثبت بالأدلة", "Dayworks": "أعمال المياومة (بالتكلفة الفعلية)", "build-up of the rate": "تفصيل بناء السعر", "hold up the works": "يعطّل الأعمال", "determination": "تقدير/قرار (المهندس)"}, "notes_ar": "هذا حوارٌ تجاري نموذجي بين كمّيي الطرفين (QS = Quantity Surveyor). القاعدة المهنية: \"proceed and keep the commercial side open\" أي نفّذ العمل ولا تجعل الخلاف على السعر يوقفه. انتبه لنطق Variation بحرف V (لا F) والنبر vair-ee-AY-shun."}, {"id": "D03", "title": "مطالبة مرفوضة والخطوة التالية — إشعار عدم الرضا والإحالة للمجلس", "scenario_ar": "بعد رفض المهندس لمطالبة المقاول، يناقش الطرفان الخطوات التالية: حفظ الحقوق، وإشعار عدم الرضا، وإحالة النزاع إلى مجلس فضّ المنازعات (DAAB).", "lines": [{"speaker": "Contractor's PM", "en": "We've received your determination rejecting our claim in full. With respect, we don't accept the reasoning.", "ar": "استلمنا تقديركم برفض مطالبتنا بالكامل. ومع احترامنا، لا نقبل التسبيب."}, {"speaker": "Engineer", "en": "I appreciate that. My determination stands, but of course it's not the end of the road for you.", "ar": "أقدّر ذلك. تقديري قائم، لكنه بالطبع ليس نهاية المطاف بالنسبة لكم."}, {"speaker": "Contractor's PM", "en": "Indeed. We'll be issuing a Notice of Dissatisfaction within the 28-day window to preserve our position.", "ar": "بالفعل. سنُصدر إشعار عدم رضا خلال مهلة الـ28 يوماً للحفاظ على موقفنا."}, {"speaker": "Engineer", "en": "That's your right under the Contract. After the NOD, the next step is to refer the Dispute to the DAAB.", "ar": "هذا حقكم بموجب العقد. بعد إشعار عدم الرضا، الخطوة التالية إحالة النزاع إلى مجلس فضّ المنازعات."}, {"speaker": "Contractor's PM", "en": "Correct. We'd prefer to resolve this amicably first, but we won't let the time-bar run against us.", "ar": "صحيح. نفضّل حلّ الأمر ودياً أولاً، لكننا لن ندع مهلة السقوط تجري ضدّنا."}, {"speaker": "Engineer", "en": "Sensible. The DAAB's decision will be binding on both Parties even if either side later gives a further Notice of Dissatisfaction.", "ar": "تصرّف حكيم. قرار المجلس سيكون ملزماً للطرفين حتى لو قدّم أحدهما لاحقاً إشعار عدم رضا آخر."}, {"speaker": "Contractor's PM", "en": "Understood. All of this is without prejudice to our right to proceed to arbitration if the matter isn't finally settled.", "ar": "مفهوم. كل هذا دون إخلال بحقنا في اللجوء إلى التحكيم إذا لم تُحسم المسألة نهائياً."}, {"speaker": "Engineer", "en": "Agreed. Let's keep the lines of communication open and try to narrow the issues before it escalates.", "ar": "متفقون. لنُبقِ قنوات التواصل مفتوحة ونحاول تضييق نقاط الخلاف قبل تصعيدها."}], "glossary": {"determination": "تقدير/قرار (المهندس)", "rejecting our claim in full": "رفض مطالبتنا بالكامل", "with respect": "مع احترامنا (تمهيد مهذّب للاعتراض)", "my determination stands": "تقديري قائم/نافذ", "not the end of the road": "ليس نهاية المطاف", "Notice of Dissatisfaction (NOD)": "إشعار عدم الرضا", "preserve our position": "نحفظ موقفنا", "refer the Dispute to the DAAB": "إحالة النزاع إلى مجلس فضّ المنازعات", "amicably": "ودّياً", "time-bar": "مهلة السقوط الزمني", "binding on both Parties": "مُلزم للطرفين", "without prejudice to": "دون إخلال بـ", "proceed to arbitration": "اللجوء إلى التحكيم", "narrow the issues": "تضييق نقاط الخلاف"}, "notes_ar": "هذه محادثة \"معركة\" لكنها مهذّبة جداً — هكذا يتفاوض المحترفون. لاحظ \"With respect\" و\"I appreciate that\": عبارات تلطيف تسبق الاعتراض. ومصطلح time-bar حاسم: تأخّرُ إشعارٍ يوماً واحداً قد يُسقط الحق. تدرّب على نطق dissatisfaction: dis-sat-is-FAK-shun."}], "challenges": [{"title": "صوت P مقابل B", "ar": "لا يوجد صوت /p/ في العربية فيستبدله العرب بـ/b/. الفرق: /p/ مهموس بدفعة هواء قوية، /b/ مجهور. ضع ورقة أمام فمك — يجب أن تهتز بقوة مع P.", "pairs": [["Party", "حفلة/طرف"], ["Payment", "دفعة"], ["Performance", "أداء"], ["Provision", "حُكم/بند"], ["Price", "سعر"], ["Period", "فترة"]], "drill": "The Party shall provide the Performance Security before the Payment Period begins."}, {"title": "صوت V مقابل F", "ar": "‏/v/ مثل /f/ لكن بذبذبة في الأوتار الصوتية. أطبق أسنانك العليا على شفتك السفلى وأصدر صوتاً مجهوراً. ضع يدك على حنجرتك — يجب أن تشعر بالاهتزاز.", "pairs": [["Variation", "تغيير"], ["Value", "قيمة"], ["Provide", "يقدّم"], ["Approval", "موافقة"], ["Valid", "ساري"], ["Waive", "يتنازل"]], "drill": "The Variation shall be valued and approved, provided the value is verified."}, {"title": "النبر (Word Stress) يغيّر المعنى", "ar": "في الإنجليزية النبر صوتيٌّ مميِّز للمعنى. CON-tract (اسم: عقد) ≠ con-TRACT (فعل: ينكمش). أخطاء النبر أكثر ما يجعل نطق العرب «ثقيلاً».", "pairs": [["CONtract (عقد)", "conTRACT (ينكمش)"], ["PERmit (تصريح)", "perMIT (يسمح)"], ["REcord (سجل)", "reCORD (يسجّل)"], ["OBject (شيء)", "obJECT (يعترض)"], ["PREsent (حاضر)", "preSENT (يقدّم)"], ["SUBject (موضوع)", "subJECT (يُخضع)"]], "drill": "Under this CONtract, the Contractor must obtain a PERmit before he is perMITted to proceed."}, {"title": "الثاء والذال: /θ/ و /ð/", "ar": "ميزة لك كعربي! /θ/ = ثاء (third, breach of faith) و /ð/ = ذال (the, therefore, thereof). لا تستبدلهما بـ s/z أو t/d كما يفعل غير العرب.", "pairs": [["third party (طرف ثالث)", "/θ/"], ["thereof (منه)", "/ð/"], ["therein (فيه)", "/ð/"], ["method (طريقة)", "/θ/"], ["within (خلال)", "/ð/"], ["monthly (شهري)", "/θ/"]], "drill": "The third party shall be notified monthly of the methods and the terms thereof."}, {"title": "التقاء السواكن (Consonant Clusters)", "ar": "العربية لا تبدأ الكلمة بساكنَين فيُقحم العرب همزة أو كسرة: «إسبيسيفيكيشن». تدرّب على البدء بالعنقود مباشرة دون حركة قبله.", "pairs": [["Specification", "مواصفات — لا تقل iS-pecification"], ["Structure", "هيكل"], ["Subcontractor", "مقاول باطن"], ["Instruction", "تعليمات"], ["Strict", "صارم"], ["Scope", "نطاق"]], "drill": "Strict instructions: the structure shall comply with the specification and the scope."}, {"title": "الحروف الصامتة (Silent Letters)", "ar": "حروف تُكتب ولا تُنطق — احفظها سماعياً لا إملائياً.", "pairs": [["debt → /det/", "دَين — حرف b صامت"], ["receipt → /rɪˈsiːt/", "إيصال — p صامتة"], ["indict → /ɪnˈdaɪt/", "يتّهم — c صامتة"], ["subtle → /ˈsʌtəl/", "دقيق — b صامتة"], ["hours → /aʊəz/", "ساعات — h صامتة"], ["foreign → /ˈfɒrɪn/", "أجنبي — g صامتة"]], "drill": "The receipt of the debt shall be acknowledged within twenty-four hours."}], "dictation": [{"level": "سهل", "text": "The Contractor shall execute the Works.", "ar": "ينفّذ المقاولُ الأعمال."}, {"level": "سهل", "text": "The Engineer may issue instructions.", "ar": "يجوز للمهندس إصدار التعليمات."}, {"level": "سهل", "text": "Each Party shall keep the documents confidential.", "ar": "يحافظ كل طرف على سرية المستندات."}, {"level": "متوسط", "text": "The Contractor shall be entitled to an extension of time.", "ar": "يستحق المقاول تمديداً لمدة الإنجاز."}, {"level": "متوسط", "text": "The Employer shall pay the amount certified within fifty-six days.", "ar": "يسدد صاحبُ العمل المبلغ المعتمد خلال ستة وخمسين يوماً."}, {"level": "متوسط", "text": "The Contractor shall give a Notice of Claim to the Engineer.", "ar": "يوجّه المقاول إشعار مطالبة إلى المهندس."}, {"level": "متوسط", "text": "Variations may be instructed at any time before the Taking-Over Certificate.", "ar": "يجوز إصدار أوامر التغيير في أي وقت قبل شهادة التسلّم."}, {"level": "صعب", "text": "Subject to the provisions of the Contract, the Engineer shall make a fair determination.", "ar": "مع مراعاة أحكام العقد، يُصدر المهندس تقديراً منصفاً."}, {"level": "صعب", "text": "Notwithstanding any other provision, the total liability shall not exceed the Contract Price.", "ar": "على الرغم من أي حكم آخر، لا تتجاوز المسؤولية الإجمالية قيمة العقد."}, {"level": "صعب", "text": "The Contractor shall indemnify and hold harmless the Employer against all such claims.", "ar": "يعوّض المقاولُ صاحبَ العمل ويُبرئه من جميع تلك المطالبات."}, {"level": "صعب", "text": "If no Notice of Dissatisfaction is given, the decision shall become final and binding.", "ar": "إذا لم يُقدَّم إشعار عدم رضا، أصبح القرار نهائياً وملزماً."}, {"level": "صعب", "text": "The Performance Security shall be valid until the Contractor has remedied any defects.", "ar": "يظل ضمان حسن التنفيذ سارياً حتى يُصلح المقاول أي عيوب."}], "categories": ["أطراف العقد", "الإنهاء والإخلال", "البنود النمطية", "التغييرات والمطالبات", "الجودة والعيوب", "الدفع والمال", "اللغة القانونية", "المخاطر والمسؤولية", "الوقت والبرنامج", "تسوية المنازعات", "كلمات بمعانٍ خاصة", "وثائق العقد"]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- التقدّم (localStorage) ---------- */
const KEY='ce_progress_v1';
const INTERVALS={1:0,2:1,3:3,4:7,5:16};
function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
let P = load();
function load(){try{return Object.assign({srs:{},lessonsDone:[],readingDone:[],xp:0,streak:0,last:''},JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){return {srs:{},lessonsDone:[],readingDone:[],xp:0,streak:0,last:''};}}
function save(){localStorage.setItem(KEY,JSON.stringify(P));refreshHeader();}
function addXp(n){P.xp+=n;save();}
function touchStreak(){const t=todayStr();if(P.last===t)return;if(P.last){const gap=Math.round((new Date(t)-new Date(P.last))/86400000);P.streak=gap===1?P.streak+1:1;}else P.streak=1;P.last=t;save();}
function srsEntry(en){if(!P.srs[en])P.srs[en]={box:1,due:todayStr(),seen:0,correct:0};return P.srs[en];}
function srsReview(en,ok){const e=srsEntry(en);e.seen++;if(ok){e.correct++;e.box=Math.min(5,e.box+1);addXp(5);}else{e.box=1;addXp(1);}e.due=addDays(INTERVALS[e.box]);save();}
function dueCards(){const t=todayStr();return DATA.vocab.filter(v=>{const e=P.srs[v.en];return !e||e.due<=t;});}
function mastered(){return Object.values(P.srs).filter(e=>e.box>=4).length;}
function refreshHeader(){$('#hXp').textContent=P.xp;$('#hMastered').textContent=mastered()+' / '+DATA.vocab.length;$('#hDue').textContent=dueCards().length;}

/* ---------- النطق (Web Speech API) ---------- */
let VOICES=[];
function loadVoices(){VOICES=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));}
loadVoices(); if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){const pref=localStorage.getItem('ce_voice')||'GB';let v=VOICES.find(x=>new RegExp(pref,'i').test(x.name+x.lang));return v||VOICES.find(x=>/GB|UK/i.test(x.name+x.lang))||VOICES[0]||null;}
function say(text,rate){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-GB';u.rate=rate||0.95;speechSynthesis.speak(u);}
function rep3(text){speechSynthesis.cancel();for(let i=0;i<3;i++){const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}u.rate=0.85;speechSynthesis.speak(u);}}
function shadow(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}u.rate=0.8;u.onend=()=>setTimeout(()=>say(text,0.8),2200);speechSynthesis.speak(u);}
let SBID=0;
function speakBar(text,opts={}){const id='sb'+(SBID++);window['_t_'+id]=text;
  let h='<span class="speakbar">';
  h+='<button class="btn" onclick="say(window._t_'+id+',0.95)">🔊 استمع</button>';
  h+='<button class="btn alt" onclick="say(window._t_'+id+',0.6)">🐢 بطيء</button>';
  h+='<button class="btn alt" onclick="rep3(window._t_'+id+')">🔁 ×3</button>';
  if(opts.shadow)h+='<button class="btn alt" onclick="shadow(window._t_'+id+')">🎤 استمع ثم كرّر</button>';
  h+='</span>';return h;}

/* ---------- Markdown مصغّر ---------- */
function inlineMd(s){return s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function splitRow(line){let t=line.trim();if(t.startsWith('|'))t=t.slice(1);if(t.endsWith('|'))t=t.slice(0,-1);return t.split('|').map(s=>s.trim());}
function md(src){const L=src.split('\n');let h='',i=0;
  while(i<L.length){let line=L[i];
    if(/^\s*$/.test(line)){i++;continue;}
    if(line.trim().startsWith('|') && i+1<L.length && /-/.test(L[i+1]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])){
      const head=splitRow(line);i+=2;const rows=[];
      while(i<L.length && L[i].trim().startsWith('|')){rows.push(splitRow(L[i]));i++;}
      h+='<table><thead><tr>'+head.map(c=>'<th>'+inlineMd(esc(c))+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inlineMd(esc(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue;}
    let m;
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){const n=m[1].length;h+='<h'+n+'>'+inlineMd(esc(m[2]))+'</h'+n+'>';i++;continue;}
    if(/^\s*>/.test(line)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++;}h+='<blockquote>'+inlineMd(esc(b.join(' ')))+'</blockquote>';continue;}
    if(/^\s*[-*]\s+/.test(line)){const b=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){b.push(L[i].replace(/^\s*[-*]\s+/,''));i++;}h+='<ul>'+b.map(x=>'<li>'+inlineMd(esc(x))+'</li>').join('')+'</ul>';continue;}
    if(/^\s*---\s*$/.test(line)){h+='<hr>';i++;continue;}
    const b=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{1,6})\s/.test(L[i])&&!L[i].trim().startsWith('|')&&!/^\s*>/.test(L[i])&&!/^\s*[-*]\s+/.test(L[i])){b.push(L[i]);i++;}
    h+='<p>'+inlineMd(esc(b.join(' ')))+'</p>';}
  return h;}

/* ---------- MCQ ---------- */
function mcq(container,q,onAns){const wrap=document.createElement('div');
  wrap.innerHTML='<p><b>'+esc(q.q)+'</b></p>';
  q.options.forEach((opt,idx)=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;
    b.onclick=()=>{if(wrap.dataset.done)return;wrap.dataset.done='1';
      const btns=wrap.querySelectorAll('.opt');btns[q.answer].classList.add('correct');
      if(idx!==q.answer)b.classList.add('wrong');
      const ex=document.createElement('div');ex.className=idx===q.answer?'note':'warn';ex.style.marginTop='8px';
      ex.innerHTML=(idx===q.answer?'✅ صحيحة. ':'❌ الصواب: <b>'+esc(q.options[q.answer])+'</b>. ')+esc(q.explain||'');
      wrap.appendChild(ex);if(onAns)onAns(idx===q.answer);};
    wrap.appendChild(b);});
  container.appendChild(wrap);}

/* ---------- التنقّل ---------- */
const PAGES=[
  ['home','🏠 الرئيسية'],['lessons','📚 الدروس'],['cards','🗂️ البطاقات'],['pron','🔊 النطق'],
  ['read','📖 القراءة'],['dlg','💬 المحادثات'],['dict','✍️ الإملاء'],['glos','🔎 المعجم']
];
function buildNav(){const n=$('#nav');n.innerHTML='';PAGES.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>go(id);n.appendChild(b);});}
let CUR='home';

let cardIdx=0,cardDeck=[],cardShown=false;
RENDER.cards=()=>{V().innerHTML='';
  const ctrl=document.createElement('div');ctrl.className='row';
  ctrl.innerHTML='<label>المراجعة: </label>';
  const sel=document.createElement('select');['المستحقّة اليوم','كل المصطلحات','حسب التصنيف'].forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t;sel.appendChild(o);});
  const catSel=document.createElement('select');catSel.style.display='none';DATA.categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;catSel.appendChild(o);});
  ctrl.appendChild(sel);ctrl.appendChild(catSel);
  const box=document.createElement('div');
  function build(){cardIdx=0;cardShown=false;const mode=+sel.value;catSel.style.display=mode===2?'':'none';
    cardDeck=mode===0?dueCards():mode===1?DATA.vocab.slice():DATA.vocab.filter(v=>v.cat===catSel.value);draw();}
  function draw(){box.innerHTML='';
    if(!cardDeck.length){box.innerHTML='<div class="note">🎉 لا بطاقات مستحقّة الآن. اختر «كل المصطلحات» للمراجعة الحرّة.</div>';return;}
    if(cardIdx>=cardDeck.length){box.innerHTML='<div class="note">✅ أنهيت هذه المجموعة! أحسنت.</div>';return;}
    const v=cardDeck[cardIdx];
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="progress" style="margin-bottom:10px"><div style="width:'+((cardIdx+1)/cardDeck.length*100)+'%"></div></div>'+
      '<div class="muted">بطاقة '+(cardIdx+1)+' من '+cardDeck.length+'</div>'+
      '<div class="en" style="margin:10px 0"><span class="termEN">'+esc(v.en)+'</span><br><span class="ipa">'+esc(v.ipa)+'</span> &nbsp; <span class="syl">🗣️ '+esc(v.syllables)+'</span></div>'+
      speakBar(v.en);
    box.appendChild(c);
    if(!cardShown){const b=document.createElement('button');b.className='btn';b.textContent='🔄 اكشف المعنى';b.onclick=()=>{cardShown=true;draw();};box.appendChild(b);
      const h=document.createElement('div');h.className='muted';h.style.marginTop='6px';h.textContent='استحضر المعنى والنطق من ذاكرتك أولاً.';box.appendChild(h);}
    else{const back=document.createElement('div');back.className='card';
      back.innerHTML='<h3>'+esc(v.ar)+'</h3><p>'+esc(v.def_ar)+'</p>'+
        '<div class="en" style="font-size:16px">“'+esc(v.ex_en)+'”</div>'+speakBar(v.ex_en,{shadow:true})+
        '<p><b>الترجمة:</b> '+esc(v.ex_ar)+'</p>'+
        (v.collocations?('<div>'+v.collocations.map(x=>'<span class="chip en">'+esc(x)+'</span>').join('')+'</div>'):'')+
        (v.tip?('<div class="info" style="margin-top:8px">💡 '+esc(v.tip)+'</div>'):'');
      box.appendChild(back);
      const row=document.createElement('div');row.className='row';
      const yes=document.createElement('button');yes.className='btn';yes.textContent='✅ تذكّرت';yes.onclick=()=>{srsReview(v.en,true);cardShown=false;cardIdx++;draw();};
      const no=document.createElement('button');no.className='btn alt';no.textContent='❌ أعدها قريباً';no.onclick=()=>{srsReview(v.en,false);cardShown=false;cardIdx++;draw();};
      row.appendChild(yes);row.appendChild(no);box.appendChild(row);}}
  sel.onchange=build;catSel.onchange=build;
  V().appendChild(ctrl);V().appendChild(box);build();};

function normW(s){return s.toLowerCase().replace(/-/g,' ').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);}
function diffMark(user,target){const a=normW(user),b=normW(target),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let x=n-1;x>=0;x--)for(let y=m-1;y>=0;y--)dp[x][y]=a[x]===b[y]?dp[x+1][y+1]+1:Math.max(dp[x+1][y],dp[x][y+1]);
  let x=0,y=0;const mk=new Array(m).fill(false);
  while(x<n&&y<m){if(a[x]===b[y]){mk[y]=true;x++;y++;}else if(dp[x+1][y]>=dp[x][y+1])x++;else y++;}
  return {b,mk,correct:mk.filter(Boolean).length,total:m};}
let curDict=null;
RENDER.dict=()=>{V().innerHTML='<h2>✍️ الإملاء السمعي</h2><div class="muted">استمع (بلا نص)، اكتب ما سمعته، ثم تحقّق. أقوى تمرين لربط الصوت بالكلمة.</div>';
  const lv=document.createElement('select');['الكل','سهل','متوسط','صعب'].forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;lv.appendChild(o);});
  const box=document.createElement('div');
  function pool(){return DATA.dictation.filter(d=>lv.value==='الكل'||d.level===lv.value);}
  function pick(){const p=pool();curDict=p[Math.floor(Math.random()*p.length)];render();}
  function render(){box.innerHTML='';const it=curDict;const c=document.createElement('div');c.className='card';
    c.innerHTML='<span class="pill">'+esc(it.level)+'</span><p><b>استمع:</b></p>'+speakBar(it.text);
    const inp=document.createElement('input');inp.type='text';inp.placeholder='type what you hear...';inp.className='en';inp.style.width='100%';inp.style.marginTop='10px';
    c.appendChild(inp);
    const row=document.createElement('div');row.className='row';row.style.marginTop='8px';
    const chk=document.createElement('button');chk.className='btn';chk.textContent='تحقّق ✅';
    const rev=document.createElement('button');rev.className='btn ghost';rev.textContent='👁️ اكشف';
    const nxt=document.createElement('button');nxt.className='btn alt';nxt.textContent='🎲 عبارة جديدة';
    row.appendChild(chk);row.appendChild(rev);row.appendChild(nxt);c.appendChild(row);
    const out=document.createElement('div');out.style.marginTop='10px';c.appendChild(out);
    chk.onclick=()=>{if(!inp.value.trim()){out.innerHTML='<div class="warn">اكتب ما سمعته أولاً.</div>';return;}
      const r=diffMark(inp.value,it.text);const pct=Math.round(r.correct/Math.max(1,r.total)*100);
      const words=r.b.map((w,i)=>'<span style="color:'+(r.mk[i]?'var(--green);font-weight:600':'var(--red);text-decoration:underline')+'">'+esc(w)+'</span>').join(' ');
      out.innerHTML='<h3>دقّتك: '+pct+'% ('+r.correct+'/'+r.total+' كلمة)</h3><div class="readEN">'+words+'</div><div class="muted">🟢 أصبتها · 🔴 فاتتك</div><p><b>الترجمة:</b> '+esc(it.ar)+'</p>';
      addXp(Math.max(1,Math.floor(pct/20)));};
    rev.onclick=()=>{out.innerHTML='<div class="info"><b>النص:</b> <span class="en">'+esc(it.text)+'</span><br>'+esc(it.ar)+'</div>';};
    nxt.onclick=pick;box.appendChild(c);}
  lv.onchange=pick;V().appendChild(lv);V().appendChild(box);pick();};

RENDER.glos=()=>{V().innerHTML='<h2>🔎 معجم المصطلحات</h2>';
  const row=document.createElement('div');row.className='row';
  const q=document.createElement('input');q.type='text';q.placeholder='بحث: claim أو مطالبة...';q.style.flex='1';

  row.appendChild(q);row.appendChild(cat);V().appendChild(row);
  const cnt=document.createElement('div');cnt.className='muted';cnt.style.margin='8px 0';V().appendChild(cnt);
  const box=document.createElement('div');V().appendChild(box);
  function fill(){const term=q.value.trim().toLowerCase();box.innerHTML='';let res=DATA.vocab.filter(v=>{
      if(cat.value&&v.cat!==cat.value)return false;
      if(term){return (v.en+' '+v.ar+' '+v.def_ar+' '+v.cat).toLowerCase().includes(term);}return true;});
    cnt.textContent='النتائج: '+res.length;
    res.forEach(v=>{const d=document.createElement('details');d.innerHTML='<summary>'+esc(v.en)+' — '+esc(v.ar)+' · '+esc(v.cat)+'</summary>'+
      '<div class="en" style="margin:6px 0"><span class="termEN" style="font-size:22px">'+esc(v.en)+'</span> <span class="ipa">'+esc(v.ipa)+'</span> <span class="syl">'+esc(v.syllables)+'</span></div>'+speakBar(v.en)+
      '<p>'+esc(v.def_ar)+'</p><div class="en">“'+esc(v.ex_en)+'”</div>'+speakBar(v.ex_en)+'<p><b>الترجمة:</b> '+esc(v.ex_ar)+'</p>'+
      (v.collocations?('<div>'+v.collocations.map(x=>'<span class="chip en">'+esc(x)+'</span>').join('')+'</div>'):'')+(v.tip?'<div class="info" style="margin-top:6px">💡 '+esc(v.tip)+'</div>':'');
      box.appendChild(d);});}
  q.oninput=fill;cat.onchange=fill;fill();};
